name: Release

# Runs on a pushed version tag (v0.2.0, v1.0.0, ...). Order:
#   verify    tag matches the workspace version, CHANGELOG has a section for it,
#             and every crate packages and builds (cargo package --workspace)
#   binaries  release binaries for the platforms install.sh and the formula use
#   publish   crates.io, in dependency order; fails on any error except
#             "this version is already on crates.io", so a re-run is safe
#   release   GitHub release with the binaries, checksums.sha256, CHANGELOG notes
#   homebrew  Formula/parsnip.rb in omar16100/homebrew-tap (update-homebrew.yml).
#             Called directly because a release created with GITHUB_TOKEN does
#             not trigger other workflows' `release: published` events.

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag, workspace version and CHANGELOG
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          manifest_version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "parsnip-cli") | .version')
          echo "tag version: $version, parsnip-cli version: $manifest_version"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::tag $tag does not match workspace version $manifest_version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Packages every crate and builds each package against the others'
      # packaged sources (a temporary local registry), so a missing file or a
      # dependency that only resolves through a path is caught before anything
      # is uploaded. The publish job can then skip per-crate verification.
      - name: Package and verify all crates
        run: cargo package --workspace --locked

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: parsnip-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: parsnip-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: parsnip-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parsnip-cli

      - name: Check the binary
        # Runs it when the runner can execute the target; a cross-compiled
        # binary (x86_64 macOS on the arm64 runner) only gets an arch check.
        run: |
          bin="target/${{ matrix.target }}/release/parsnip"
          file "$bin"
          case "$(uname -m)" in
            x86_64) host_arch=x86_64 ;;
            arm64|aarch64) host_arch=aarch64 ;;
            *) host_arch=unknown ;;
          esac
          case "${{ matrix.target }}" in
            "$host_arch"-*)
              out=$("$bin" --version)
              echo "$out"
              if [ "$out" != "parsnip ${{ needs.verify.outputs.version }}" ]; then
                echo "::error::expected 'parsnip ${{ needs.verify.outputs.version }}', got '$out'"
                exit 1
              fi
              ;;
            x86_64-apple-darwin)
              file "$bin" | grep -q 'x86_64' || { echo "::error::not an x86_64 binary"; exit 1; }
              ;;
            *)
              echo "::error::no check defined for ${{ matrix.target }} on $(uname -m)"
              exit 1
              ;;
          esac

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.name }}.tar.gz parsnip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -uo pipefail

          # Sparse index path for crate names of 4+ characters: ab/cd/abcd...
          in_index() {
            local crate="$1"
            curl -fsS -A "parsnip-release (github.com/omar16100/parsnip)" \
              "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null
          }

          publish() {
            local crate="$1" attempt out
            if in_index "$crate"; then
              echo "::notice::$crate $VERSION is already on crates.io, skipping"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              echo "Publishing $crate $VERSION (attempt $attempt)"
              # Verified by `cargo package --workspace` in the verify job.
              if out=$(cargo publish -p "$crate" --locked --no-verify 2>&1); then
                echo "$out"
                echo "::notice::published $crate $VERSION"
                return 0
              fi
              echo "$out"
              # Another run published it between the index check and the upload.
              # Trust the message only once the index agrees.
              if grep -qiE "already (exists|uploaded)" <<<"$out"; then
                for _ in 1 2 3 4 5 6; do
                  if in_index "$crate"; then
                    echo "::notice::$crate $VERSION is already on crates.io, skipping"
                    return 0
                  fi
                  sleep 10
                done
                echo "::error::$crate: cargo says 'already exists' but $VERSION is not in the index"
                return 1
              fi
              # A dependency published a moment ago may not be in the index yet.
              if grep -qE "failed to select a version for the requirement|no matching package named" <<<"$out"; then
                echo "Waiting for dependencies of $crate to reach the index"
                sleep $((attempt * 30))
                continue
              fi
              echo "::error::cargo publish -p $crate failed (see output above)"
              return 1
            done
            echo "::error::$crate: dependencies still not in the index after 5 attempts"
            return 1
          }

          # Dependency order: core <- storage, search <- mcp <- cli
          for crate in parsnip-core parsnip-storage parsnip-search parsnip-mcp parsnip-cli; do
            publish "$crate" || exit 1
          done

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum parsnip-*.tar.gz > checksums.sha256
          cat checksums.sha256
          test "$(wc -l < checksums.sha256)" -eq 3

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[0-9A-Za-z.]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::empty CHANGELOG section for $VERSION"
            exit 1
          fi
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            dist/parsnip-linux-amd64.tar.gz
            dist/parsnip-macos-amd64.tar.gz
            dist/parsnip-macos-arm64.tar.gz
            dist/checksums.sha256

  homebrew:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

[package]
name = "parsnip-storage"
description = "Storage backends for Parsnip memory management platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["redb"]
redb = ["dep:redb"]
sqlite = ["dep:rusqlite"]
# Client half of the storage RPC. The protocol and the server-side dispatcher are
# always compiled; only the HTTP client is optional.
remote = ["dep:reqwest"]
remote-tls = ["remote", "reqwest/rustls-tls"]

[dependencies]
parsnip-core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Storage backends
redb = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

# HTTP client for remote mode (see the `remote` feature)
reqwest = { workspace = true, optional = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
